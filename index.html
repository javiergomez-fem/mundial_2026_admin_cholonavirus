<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Porra Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--border:#2a2a3a;
  --accent:#e8ff3c;--text:#f0f0f8;--muted:#6b6b80;
  --green:#3cffb8;--blue:#3cb8ff;--red:#ff5c5c;--gold:#ffb83c;
  --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}

/* HEADER */
.header{padding:16px 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.logo-title{font-size:20px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}
.logo-title span{color:var(--accent)}
.logo-sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:0.03em}
.sync-status{font-size:10px;color:var(--muted);padding:3px 0 0;display:flex;align-items:center;gap:5px;font-family:'Space Mono',monospace}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sync-dot.ok{background:var(--green)}.sync-dot.loading{background:var(--gold);animation:blink 0.8s infinite}.sync-dot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.header-btns{display:flex;gap:6px;flex-shrink:0}
.btn{height:var(--tap);padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:12px;font-family:'Syne',sans-serif;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:opacity 0.15s;-webkit-appearance:none}
.btn:active{opacity:0.7}
.btn-wa{background:#25D366;border-color:#25D366;color:#fff}
.btn-primary{background:var(--accent);color:#0a0a0f;border-color:var(--accent)}

/* TABS - 2x2 grid on mobile */
.tabs-wrap{margin-top:14px;border-bottom:1px solid var(--border)}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:0}
.tab{padding:12px 8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;min-height:var(--tap);display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;border-right:1px solid var(--border)}
.tab:nth-child(2n){border-right:none}
.tab:nth-child(1),.tab:nth-child(2){border-bottom:1px solid var(--border)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(232,255,60,0.04)}
@media(min-width:600px){
  .tabs{display:flex;padding:0 24px}
  .tab{border-right:none;border-bottom:2px solid transparent;justify-content:flex-start}
  .tab:nth-child(1),.tab:nth-child(2){border-bottom:2px solid transparent}
  .tab.active{border-bottom-color:var(--accent)}
}

/* CONTENT */
.content{padding:14px 16px 80px;max-width:600px;margin:0 auto}
.screen{display:none}.screen.active{display:block}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stats-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats-grid-4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-label{font-size:9px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:0.08em;margin-bottom:5px;text-transform:uppercase}
.stat-value{font-size:20px;font-weight:800;line-height:1}
.stat-value small{font-size:12px;color:var(--muted);font-weight:400}
.stat-value.sm{font-size:13px;padding-top:2px;font-weight:600}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.card-header{padding:8px 12px;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;border-bottom:1px solid var(--border);font-family:'Space Mono',monospace}

/* RANKING TABLE */
.rank-table{width:100%}
.rank-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(42,42,58,0.5);gap:8px}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-size:16px;width:28px;flex-shrink:0;text-align:center}
.rank-name{flex:1;font-weight:600;font-size:14px}
.rank-pts{font-size:20px;font-weight:800;text-align:right;min-width:36px}
.rank-detail{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.rank-diff{font-size:10px;color:var(--muted);margin-left:4px}

/* MATCH ROWS */
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.match-date-bar{font-size:10px;color:var(--accent);font-family:'Space Mono',monospace;padding:6px 12px;background:rgba(232,255,60,0.06);letter-spacing:0.06em;text-transform:uppercase;border-bottom:1px solid var(--border);font-weight:700}
.match-row{display:flex;align-items:center;padding:12px 12px;gap:6px;border-bottom:1px solid rgba(42,42,58,0.5)}
.match-row:last-child{border-bottom:none}
.match-team{flex:1;font-size:14px;font-weight:500;color:var(--text)}
.match-team.away{text-align:right}
.match-team.win{font-weight:800;color:var(--accent)}
.match-score{display:flex;align-items:center;gap:5px;flex-shrink:0}
.si{width:40px;height:40px;text-align:center;border:2px solid #3a3a50;border-radius:8px;font-size:17px;font-weight:700;background:#1c1c28;color:#f0f0f8;font-family:'Space Mono',monospace;-webkit-appearance:none;appearance:none}
.si:focus{outline:none;border-color:var(--accent);background:rgba(232,255,60,0.05)}
.si.done{border-color:rgba(60,255,184,0.5);background:rgba(60,255,184,0.07);color:var(--green);font-weight:800}
.si::-webkit-inner-spin-button,.si::-webkit-outer-spin-button{-webkit-appearance:none}
.sep{color:var(--muted);font-size:16px;font-weight:700}
.match-status{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:'Space Mono',monospace;white-space:nowrap}
.ms-done{background:rgba(60,255,184,0.15);color:var(--green)}
.ms-pend{background:rgba(255,255,255,0.06);color:var(--muted)}

/* BADGES */
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:'Space Mono',monospace;white-space:nowrap}
.bg{background:rgba(60,255,184,0.15);color:var(--green)}
.bb{background:rgba(60,184,255,0.15);color:var(--blue)}
.br{background:rgba(255,92,92,0.15);color:var(--red)}
.bk{background:rgba(255,255,255,0.06);color:var(--muted)}
.bgold{background:rgba(255,184,60,0.15);color:var(--gold)}

/* DETALLE */
.pnb{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.pnb::-webkit-scrollbar{display:none}
.pnb button{flex-shrink:0;height:36px;padding:0 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;font-family:'Syne',sans-serif;-webkit-appearance:none}
.pnb button.act{background:rgba(232,255,60,0.12);color:var(--accent);border-color:rgba(232,255,60,0.4)}

/* DETALLE MATCH ROW */
.det-row{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid rgba(42,42,58,0.5);gap:6px}
.det-row:last-child{border-bottom:none}
.det-match{flex:1;font-size:11px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det-real{font-size:12px;font-weight:700;font-family:'Space Mono',monospace;min-width:36px;text-align:center;color:var(--text)}
.det-pred{display:flex;align-items:center;gap:3px;flex-shrink:0}
.det-pts{flex-shrink:0;min-width:36px;text-align:right}

/* FILTER BAR */
.fb{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.fb::-webkit-scrollbar{display:none}
.fb button,.fb select{flex-shrink:0;height:34px;padding:0 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:12px;font-family:'Syne',sans-serif;font-weight:600;-webkit-appearance:none;appearance:none}
.fb button.act{background:rgba(232,255,60,0.12);color:var(--accent);border-color:rgba(232,255,60,0.4)}
.fb select{color:var(--text);padding-right:20px}

/* GRUPOS TABLE */
.grupo-grid{display:grid;grid-template-columns:1fr repeat(4,40px);gap:0;font-size:12px}
.grupo-grid .gh{font-size:9px;font-family:'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;text-align:center;padding:4px 2px;border-bottom:1px solid var(--border)}
.grupo-grid .gh:first-child{text-align:left}
.grupo-grid .gr{padding:7px 4px;border-bottom:1px solid rgba(42,42,58,0.4);display:flex;align-items:center}
.grupo-grid .gr:nth-last-child(-n+5){border-bottom:none}
.grupo-grid select{width:36px;height:28px;text-align:center;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-size:11px;font-family:'Space Mono',monospace;-webkit-appearance:none;padding:0 2px}

/* LEGEND */
.legend{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px}
.legend-title{font-size:9px;font-weight:700;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px}
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}

/* TOAST */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:10px 20px;border-radius:20px;font-size:12px;font-family:'Space Mono',monospace;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}

/* DESKTOP */
@media(min-width:600px){
  .header{padding:20px 24px 0}
  .content{padding:20px 24px 40px}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .stats-grid-4{grid-template-columns:repeat(4,1fr)}
  .logo-title{font-size:22px}
  .btn{font-size:13px}
  .tabs-wrap{border-bottom:1px solid var(--border)}
}
</style>
</head>

function parsePred(s){
  if(!s)return{h:null,a:null};
  const p=s.split('|');if(p.length<2)return{h:null,a:null};
  const sc=p[1].split('-');

}

function getR(id){return S.results[id]||{h:null,a:null}}
function getP(pid,mid){return(S.preds[pid]||{})[mid]||{h:null,a:null}}
function winner(h,a){if(h===null||a===null)return null;return h>a?'1':a>h?'2':'X'}

// PUNTUACIÓN: +1 acertar 1X2, +1 diferencia de goles, +2 marcador exacto = máx 4
function calcPts(pid,mid){
  const r=getR(mid),p=getP(pid,mid);
  if(r.h===null||r.a===null||p.h===null||p.a===null)return null;
  let pts=0;
  // +1 por 1X2
  if(winner(p.h,p.a)===winner(r.h,r.a))pts+=1;
  // +1 por diferencia de goles
  if((p.h-p.a)===(r.h-r.a))pts+=1;
  // +2 por marcador exacto
  if(p.h===r.h&&p.a===r.a)pts+=2;
  return pts;
}

// Puntos de orden de grupo: +1 por cada posición acertada
function calcGrupoPts(pid,g){
  const real=S.grupoReal[g];
  if(!real||Object.keys(real).length===0)return null;
  const pred=S.grupoPreds[pid]?.[g];
  if(!pred||Object.keys(pred).length===0)return null;
  let pts=0;
  GROUPS[g].forEach(eq=>{if(pred[eq]&&real[eq]&&pred[eq]===real[eq])pts++;});
  return pts;
}

function totalStats(pid){
  let t=0,e=0,diff=0,oxo=0,pj=0,gpts=0;
  MATCHES.forEach(m=>{
    const v=calcPts(pid,m.id);
    if(v===null)return;
    pj++;t+=v;
    const r=getR(m.id),p=getP(pid,m.id);
    if(winner(p.h,p.a)===winner(r.h,r.a))oxo++;
    if((p.h-p.a)===(r.h-r.a))diff++;
    if(p.h===r.h&&p.a===r.a)e++;
  });
  // Sumar puntos de grupo
  Object.keys(GROUPS).forEach(g=>{
    const gp=calcGrupoPts(pid,g);
    if(gp!==null){gpts+=gp;t+=gp;}
  });
  return{t,e,diff,oxo,pj,gpts};
}

function fd(d){const p=d.split('-');const ms=['ene','feb','mar','abr','may','jun','jul'];return`${parseInt(p[2])} ${ms[parseInt(p[1])-1]}`;}

function nextMatch(){

}

async function syncSheet(){
  const dot=document.getElementById('syncDot'),msg=document.getElementById('syncMsg');
  dot.className='sync-dot loading';msg.textContent='Leyendo Google Sheets...';
  try{
    const resp=await fetch(APPS_SCRIPT_URL);
    if(!resp.ok)throw new Error('Sin acceso (HTTP '+resp.status+')');
    const data=await resp.json();

    // Sync COMPLETO: sobrescribe todo lo que viene del Sheet
    // --- Resultados de partidos (sync total) ---
    const results=data.results||{};
    // Primero limpiamos los que ya no tienen resultado en el Sheet
    Object.keys(S.results).forEach(id=>{
      if(!results[id])delete S.results[id];
    });
    // Luego volcamos todos los del Sheet
    Object.entries(results).forEach(([id,val])=>{
      if(!/^M\d{3}$/.test(id))return;
      if(val.h!==null&&val.a!==null&&!isNaN(val.h)&&!isNaN(val.a)){
        S.results[id]={h:val.h,a:val.a};
      }
    });

    // --- Orden real de grupos (sync total) ---
    const grupoReal=data.grupoReal||{};
    // Volcamos todo el grupoReal del Sheet directamente
    S.grupoReal={};
    Object.entries(grupoReal).forEach(([g,equipos])=>{
      S.grupoReal[g]={};
      Object.entries(equipos).forEach(([equipo,pos])=>{
        if(pos!==null&&!isNaN(pos))S.grupoReal[g][equipo]=pos;
      });
    });

    S.lastSync=new Date().toISOString();
    localStorage.setItem('porra26v10',JSON.stringify(S));
    dot.className='sync-dot ok';
    const t=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    const nPart=Object.keys(S.results).length;
    const nGrupo=Object.values(S.grupoReal).reduce((a,g)=>a+Object.keys(g).length,0);
    msg.textContent=`Sync ${t} · ${nPart} partidos jugados · ${nGrupo} posiciones grupo`;
    refresh();showToast(`✓ Sync completo desde el Sheet`);
  }catch(err){
    dot.className='sync-dot err';
    msg.textContent='Error: '+err.message;
    showToast('Error: '+err.message);
  }
}

function sendWhatsApp(){
  const today=new Date().toISOString().split('T')[0];
  const todayMatches=MATCHES.filter(m=>m.date===today);
  
  // Si no hay partidos hoy, buscar los más recientes jugados
  let matchesToShow=todayMatches;
  if(matchesToShow.length===0){
    // Últimos partidos con resultado
    const played=MATCHES.filter(m=>{const r=getR(m.id);return r.h!==null&&r.a!==null;});
    // Agrupados por fecha, la última fecha con resultados
    if(played.length>0){
      const lastDate=played[played.length-1].date;
      matchesToShow=played.filter(m=>m.date===lastDate);
    }
  }

  const scores=PLAYERS.map(p=>({...p,...totalStats(p.id)})).sort((a,b)=>b.t-a.t||b.e-a.e);
  const medals=['🥇','🥈','🥉','4️⃣'];
  const fd2=d=>{const p=d.split('-');const ms=['ene','feb','mar','abr','may','jun','jul'];return`${parseInt(p[2])} ${ms[parseInt(p[1])-1]}`;};

  let msg='⚽ *PORRA MUNDIAL 2026* ⚽\n';

  if(matchesToShow.length>0){
    const dateLabel=matchesToShow[0].date===today?'Hoy':fd2(matchesToShow[0].date);
    msg+=`\n📅 *Partidos ${dateLabel}*\n`;
    matchesToShow.forEach(m=>{
      const r=getR(m.id);
      const hasR=r.h!==null&&r.a!==null;
      if(hasR){
        msg+=`\n🏟 ${m.home} *${r.h} - ${r.a}* ${m.away}\n`;
      } else {
        msg+=`\n🕐 ${m.home} vs ${m.away}\n`;
      }
      PLAYERS.forEach(pl=>{
        const p=getP(pl.id,m.id);
        const hasPred=p.h!==null&&p.a!==null;
        if(!hasPred)return;
        const pv=calcPts(pl.id,m.id);
        let emoji='❌';
        if(pv===4)emoji='🎯';
        else if(pv===3)emoji='✅';
        else if(pv>=1)emoji='➕';
        else if(pv===0&&hasR)emoji='❌';
        else emoji='⏳';
        const pts=pv!==null?` (+${pv}pts)`:'';
        msg+=`  ${emoji} ${pl.name}: ${p.h}-${p.a}${pts}\n`;
      });
    });
  }

  msg+=`\n🏆 *CLASIFICACIÓN*\n`;
  scores.forEach((p,i)=>{
    msg+=`${medals[i]||`${i+1}.`} ${p.name}: *${p.t} pts*  (🎯${p.e} ✅${p.res})\n`;
  });

  const url='https://wa.me/?text='+encodeURIComponent(msg.replace(/\\n/g,'\n'));
  window.open(url,'_blank');
}

    <select onchange="setFG(this.value)" style="max-width:130px">
      <option value="all">Todos los grupos</option>
      ${'ABCDEFGHIJKL'.split('').map(g=>`<option value="${g}"${fGr===g?' selected':''}>Grupo ${g}</option>`).join('')}
    </select>
  </div>`;
  const grps=fGr==='all'?'ABCDEFGHIJKL'.split(''):[fGr];
  grps.forEach(g=>{
    const ms=MATCHES.filter(m=>m.g===g).filter(m=>{
      const r=getR(m.id),done=r.h!==null&&r.a!==null;
      if(fSt==='played')return done;if(fSt==='pending')return!done;return true;
    });
    if(!ms.length)return;
    h+=`<div class="match-card">`;
    let lastDate='';
    ms.forEach(m=>{
      const r=getR(m.id);const done=r.h!==null&&r.a!==null;
      if(m.date!==lastDate){
        h+=`<div class="match-date-bar">Grupo ${g} · ${fd(m.date)}</div>`;
        lastDate=m.date;
      }
      const hw=done&&r.h>r.a,aw=done&&r.a>r.h;
      h+=`<div class="match-row">
        <div class="match-team${hw?' win':''}">${m.home}</div>
        <div class="match-score">
          <input class="si${done?' done':''}" type="number" min="0" max="20" value="${r.h!==null?r.h:''}" placeholder="—" onchange="setR('${m.id}','h',this.value)" onfocus="this.select()">
          <span class="sep">:</span>
          <input class="si${done?' done':''}" type="number" min="0" max="20" value="${r.a!==null?r.a:''}" placeholder="—" onchange="setR('${m.id}','a',this.value)" onfocus="this.select()">
        </div>
        <div class="match-team away${aw?' win':''}">${m.away}</div>
      </div>`;
    });
    h+=`</div>`;
  });
  document.getElementById('part').innerHTML=h;
}

function setFS(v){fSt=v;renderPart()}
function setFG(v){fGr=v;renderPart()}

function renderDet(){
  let h=`<div class="pnb">${PLAYERS.map(p=>`<button class="${selPGlobal===p.id?'act':''}" onclick="selPart('${p.id}')">${p.name}</button>`).join('')}</div>`;
  const pl=PLAYERS.find(x=>x.id===selPGlobal);
  const s=totalStats(pl.id);
  const hasPreds=MATCHES.some(m=>{const p=getP(pl.id,m.id);return p.h!==null&&p.a!==null;});
  if(!hasPreds)h+=`<div style="padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;margin-bottom:12px;font-size:13px">⚠️ ${pl.name} sin pronósticos aún</div>`;
  h+=`<div class="stats-grid-4">
    <div class="stat"><div class="stat-label">Puntos</div><div class="stat-value" style="color:var(--accent)">${s.t}</div></div>
    <div class="stat"><div class="stat-label">Exactos</div><div class="stat-value">${s.e}</div></div>
    <div class="stat"><div class="stat-label">Dif. gol</div><div class="stat-value">${s.diff}</div></div>
    <div class="stat"><div class="stat-label">1X2</div><div class="stat-value">${s.oxo}</div></div>
  </div>`;
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const ms=MATCHES.filter(m=>m.g===g);
    h+=`<div class="card"><div class="card-header">Grupo ${g}</div>`;
    ms.forEach(m=>{
      const r=getR(m.id),p=getP(pl.id,m.id);
      const hasR=r.h!==null&&r.a!==null;
      const pv=calcPts(pl.id,m.id);
      let bc='bk',lbl='—';
      if(pv===4){bc='bgold';lbl='+4';}else if(pv===3){bc='bg';lbl='+3';}else if(pv===2){bc='bb';lbl='+2';}else if(pv===1){bc='bb';lbl='+1';}else if(pv===0){bc='br';lbl='+0';}
      h+=`<div class="det-row">
        <div class="det-match">${m.home} vs ${m.away}</div>
        <div class="det-real">${hasR?`${r.h}:${r.a}`:'<span style="color:var(--muted)">—</span>'}</div>
        <div class="det-pred">
          <input class="si" type="number" min="0" max="20" value="${p.h!==null?p.h:''}" placeholder="—" onchange="setP('${pl.id}','${m.id}','h',this.value)" onfocus="this.select()">
          <span class="sep" style="font-size:11px">:</span>
          <input class="si" type="number" min="0" max="20" value="${p.a!==null?p.a:''}" placeholder="—" onchange="setP('${pl.id}','${m.id}','a',this.value)" onfocus="this.select()">
        </div>
        <div class="det-pts"><span class="badge ${bc}">${lbl}</span></div>
      </div>`;
    });
    h+=`</div>`;
  });
  document.getElementById('det').innerHTML=h;
}

function selPart(id){selPGlobal=id;renderDet();}

function renderGrupo(){
  let h=`<p style="font-size:11px;color:var(--muted);margin-bottom:12px">Introduce el orden final real. <strong style="color:var(--text)">+1 punto</strong> por cada posición acertada.</p>`;
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const teams=GROUPS[g];
    h+=`<div class="card" style="margin-bottom:10px">
    <div class="card-header">Grupo ${g}</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <table style="width:100%;border-collapse:collapse;min-width:320px">
      <thead><tr>
        <th style="text-align:left;padding:7px 12px;font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;border-bottom:1px solid var(--border);white-space:nowrap">Equipo</th>
        <th style="text-align:center;padding:7px 8px;font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;border-bottom:1px solid var(--border)">Real</th>
        ${PLAYERS.map(p=>`<th style="text-align:center;padding:7px 8px;font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;border-bottom:1px solid var(--border)">${p.name}</th>`).join('')}
        <th style="text-align:center;padding:7px 8px;font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;border-bottom:1px solid var(--border)">Pts</th>
      </tr></thead>
      <tbody>`;
    teams.forEach(eq=>{
      const realPos=(S.grupoReal[g]||{})[eq]||'';
      h+=`<tr>
        <td style="padding:7px 12px;font-size:12px;font-weight:500;border-bottom:1px solid rgba(42,42,58,0.4);white-space:nowrap">${eq}</td>
        <td style="text-align:center;padding:5px 8px;border-bottom:1px solid rgba(42,42,58,0.4)">
          <select onchange="setGrupoReal('${g}','${eq}',this.value)" style="width:38px;height:30px;text-align:center;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-size:12px;font-family:'Space Mono',monospace;-webkit-appearance:none;padding:0 4px">
            <option value="">—</option>
            ${[1,2,3,4].map(n=>`<option value="${n}"${realPos==n?' selected':''}>${n}º</option>`).join('')}
          </select>
        </td>
        ${PLAYERS.map(p=>{
          const predPos=(S.grupoPreds[p.id]?.[g]||{})[eq]||'';
          const rp=(S.grupoReal[g]||{})[eq];
          const hit=rp&&predPos&&parseInt(rp)===parseInt(predPos);
          const bc=rp?(hit?'rgba(60,255,184,0.4)':'rgba(255,92,92,0.3)'):'var(--border)';
          return`<td style="text-align:center;padding:5px 8px;border-bottom:1px solid rgba(42,42,58,0.4)">
            <select onchange="setGrupoPred('${p.id}','${g}','${eq}',this.value)" style="width:38px;height:30px;text-align:center;border:1px solid ${bc};border-radius:5px;background:${hit?'rgba(60,255,184,0.08)':'var(--surface2)'};color:${hit?'var(--green)':'var(--text)'};font-size:12px;font-family:'Space Mono',monospace;-webkit-appearance:none;padding:0 4px">
              <option value="">—</option>
              ${[1,2,3,4].map(n=>`<option value="${n}"${predPos==n?' selected':''}>${n}º</option>`).join('')}
            </select>
          </td>`;
        }).join('')}
        <td style="text-align:center;padding:5px 8px;border-bottom:1px solid rgba(42,42,58,0.4)">
          ${PLAYERS.map(p=>{
            const rp=(S.grupoReal[g]||{})[eq];
            const pp=(S.grupoPreds[p.id]?.[g]||{})[eq];
            const hit=rp&&pp&&parseInt(rp)===parseInt(pp);
            return rp?`<span class="badge ${hit?'bg':'br'}" style="margin:1px">${hit?'+1':'0'}</span>`:'';
          }).join('')}
        </td>
      </tr>`;
    });
    // Total row
    h+=`<tr style="background:rgba(255,255,255,0.02)">
      <td colspan="2" style="padding:7px 12px;font-size:9px;color:var(--muted);font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.06em">Total grupo ${g}</td>
      ${PLAYERS.map(p=>{
        const gp=calcGrupoPts(p.id,g);
        return`<td style="text-align:center;padding:7px 8px"><span class="badge" style="background:rgba(232,255,60,0.12);color:var(--accent)">${gp!==null?'+'+gp:'—'}</span></td>`;
      }).join('')}
      <td></td>
    </tr>`;
    h+=`</tbody></table></div></div>`;
  });
  document.getElementById('grupo').innerHTML=h;
}

function setGrupoReal(g,eq,val){
  if(!S.grupoReal[g])S.grupoReal[g]={};
  S.grupoReal[g][eq]=val===''?null:parseInt(val);
  localStorage.setItem('porra26v10',JSON.stringify(S));refresh();
}
function setGrupoPred(pid,g,eq,val){
  if(!S.grupoPreds[pid])S.grupoPreds[pid]={};
  if(!S.grupoPreds[pid][g])S.grupoPreds[pid][g]={};
  S.grupoPreds[pid][g][eq]=val===''?null:parseInt(val);
  localStorage.setItem('porra26v10',JSON.stringify(S));refresh();
}

function setR(id,side,val){
  if(!S.results[id])S.results[id]={h:null,a:null};
  S.results[id][side]=val===''?null:parseInt(val);
  localStorage.setItem('porra26v10',JSON.stringify(S));refresh();
}
function setP(pid,mid,side,val){
  if(!S.preds[pid])S.preds[pid]={};
  if(!S.preds[pid][mid])S.preds[pid][mid]={h:null,a:null};
  S.preds[pid][mid][side]=val===''?null:parseInt(val);
  localStorage.setItem('porra26v10',JSON.stringify(S));refresh();
}
function refresh(){
  const ai=[...document.querySelectorAll('.tab')].findIndex(t=>t.classList.contains('active'));
  if(ai===0)renderClas();if(ai===1)renderPart();if(ai===2)renderDet();if(ai===3)renderGrupo();
}
function showTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['clas','part','det','grupo'][i]===name));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  if(name==='clas')renderClas();if(name==='part')renderPart();if(name==='det')renderDet();if(name==='grupo')renderGrupo();
}
function saveLocal(){localStorage.setItem('porra26v10',JSON.stringify(S));showToast('✓ Guardado');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

renderClas();
setTimeout(()=>syncSheet(),600);
</script>
</body>
</html>
